az:['預り金','','負債',LI,'社員の給料から税金や保険料を預かったので、「本人に代わって国や役所に納める」という約束。'],
kb:['繰越利益剰余金','','資本','#2e9e5b','これまでの商売で稼いで、会社の中に貯まった利益（過去の儲け）。'],
ju:['受取利息','','収益','#e8b923','預金やお金を貸していた利息がついたから、お金が増えた。'],
tt:['受取手数料','','収益','#e8b923','仲介や事務手続きなどのサービスをしたお礼をもらったから、お金が増えた。'],
ya:['受取家賃（地代）','','収益','#e8b923','持っている建物や土地を人に貸したから、お金が増えた。'],
sr:['仕入','','費用',EX,'お客様に売る商品を買い入れたから、お金が減った（コストがかかった）。'],
kw:['給料','','費用',EX,'従業員に働いてもらった対価を払ったから、お金が減った。'],
ry:['旅費交通費','','費用',EX,'営業や出張のために電車・バス・飛行機・ホテルを使ったから、お金が減った。'],
sk:['水道光熱費','','費用',EX,'お店や事務所の電気・ガス・水道を使ったから、お金が減った。'],
yc:['支払家賃（地代）','','費用',EX,'お店や事務所の建物・土地を借りているから、お金が減った。'],
ko:['租税公課','','費用',EX,'収入印紙を買ったり、固定資産税・自動車税などの税金を納めたから、お金が減った。']};
const STEPS=[['ステップ1',0],['ステップ2',20],['ステップ3',50],['ステップ4',75],['ステップ5 資産',100],['ステップ6 負債',120],['ステップ7 資本',140],['ステップ8 収益',160],['ステップ9 費用',180]];
const $=s=>document.querySelector(s);
let S,drag=null;
function init(i=0){const q=Q[i];S={i,phase:q.cash?'cash':'reason',pl:{L:[],R:[]},need:q.need.map(x=>[...x]),qmiss:false,ok:S?S.ok:0,miss:S?S.miss:0,sel:null,msg:'',cls:''};render()}
function render(){
 const q=Q[S.i],ph=S.phase,nw=q.step>3;
 let h=`<header><h1>ぼき 仕分けれんしゅう</h1><span>${S.i+1} / ${Q.length}問</span><span>一発正解 ${S.ok}　ミス ${S.miss}</span></header>`;
 h+=`<nav>${STEPS.map((s,k)=>`<button class="st ${q.step==k?'on':''}" data-go="${s[1]}">${s[0]}</button>`).join('')}</nav>`;
 const how=ph=='cash'?'① お金のイメージを、左か右のエリアにドラッグ！（増えた→左　減った→右）':ph=='reason'?(q.cash?(nw?'② のこりのカードを、正しいエリアにドラッグ！（カードの説明を読もう）':'② 理由のカードを、現金とは反対のエリアにドラッグ！'):'カードを、左と右の正しいエリアにドラッグ！（カードの説明を読もう）'):'できた！';
 h+=`<div class="q"><small>${STEPS[q.step][0]}</small><p>（${S.i+1}）${q.text}</p><p class="how">${how}</p>${nw?'<p class="how">きまり：現金・資産・費用が増える→左　負債・資本・収益が増える→右（減るときは反対）</p>':''}</div>`;
 h+=`<div class="board">${['L','R'].map(s=>`<div class="zone ${S.sel?'tgt':''}" data-s="${s}"><h3>${s=='L'?'借方（左）':'貸方（右）'}</h3>${S.pl[s].map(c=>`<div class="chip" style="--c:${c[1]}">${c[0]}</div>`).join('')}</div>`).join('')}</div>`;
 h+=`<p class="msg ${S.cls}">${S.msg}</p>`;
 if(ph=='cash'){h+=`<div class="tray"><div class="drag money ${q.a>=1000?'note':'coin'} ${S.sel=='cash'?'sel':''}" data-k="cash" role="button" tabindex="0">${q.a.toLocaleString()}円</div></div>`}
 else if(ph=='reason')h+=`<div class="tray">${q.tray.map(k=>`<div class="drag card ${nw?'w':''} ${S.sel==k?'sel':''}" data-k="${k}" style="--c:${R[k][3]}"><b>${R[k][0]}</b><span>${nw?(R[k][4]||R[k][1]):R[k][1]}</span><em>（${R[k][2]}）</em></div>`).join('')}</div>`;
 else h+=`<button class="btn" data-next>${S.i+1<Q.length?'次の問題へ':'けっかを見る'}</button>`;
 if(S.end)h+=`<div class="ov"><div class="box"><h2>おつかれさま！</h2><p>${Q.length}問中、一発正解は ${S.ok} 問、ミスは ${S.miss} 回でした。</p><button class="btn" data-go="0" data-reset>もう一度</button></div></div>`;
 $('#app').innerHTML=h;
}
function miss(side,m){S.miss++;S.qmiss=true;S.sel=null;S.msg=m;S.cls='ng';render();const z=document.querySelector(`.zone[data-s="${side}"]`);z&&z.classList.add('shake')}
function drop(k,side){
 const q=Q[S.i];
 if(S.phase=='cash'){
  const inc=q.cash=='i';
  if(side!=(inc?'L':'R'))return miss(side,inc?'お金が増えたときは、左だよ。':'お金が減ったときは、右だよ。');
  S.pl[side].push([inc?`現金＋ ${q.a.toLocaleString()}円`:`現金－ ${q.a.toLocaleString()}円`,inc?'#2f6fd0':'#d0343f']);
  S.sel=null;S.cls='ok';
  if(q.cashOnly||!S.need.length){S.phase='done';S.msg='正解！'}else{S.phase='reason';S.msg='いいね！次はカード。'}
 }else{
  const j=S.need.findIndex(n=>n[0]==k&&n[1]==side);
  if(j<0)return miss(side,S.need.some(n=>n[0]==k)?'置く場所が逆だよ。左右をよく考えよう。':'そのカードじゃないみたい。カードの説明を読みなおそう。');
  S.pl[side].push([R[k][0],R[k][3]]);S.need.splice(j,1);S.sel=null;S.cls='ok';
  if(S.need.length)S.msg='正解！もう1枚、置こう。';else{S.phase='done';S.msg='正解！'}
 }
 if(S.phase=='done'&&!S.qmiss)S.ok++;
 render();const b=$('[data-next]');b&&b.focus();
}
document.addEventListener('pointerdown',e=>{
 const t=e.target.closest('.drag');if(!t)return;e.preventDefault();
 drag={t,x:e.clientX,y:e.clientY,g:null};
});
document.addEventListener('pointermove',e=>{
 if(!drag)return;
 if(!drag.g&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>6){drag.g=drag.t.cloneNode(true);drag.g.classList.add('ghost');drag.g.classList.remove('sel');document.body.appendChild(drag.g)}
 if(drag.g){drag.g.style.left=e.clientX+'px';drag.g.style.top=e.clientY+'px';
  document.querySelectorAll('.zone').forEach(z=>z.classList.remove('over'));
  const z=document.elementFromPoint(e.clientX,e.clientY)?.closest('.zone');z&&z.classList.add('over')}
});
document.addEventListener('pointerup',e=>{
 if(!drag)return;const d=drag;drag=null;
 if(d.g){d.g.remove();document.querySelectorAll('.zone').forEach(z=>z.classList.remove('over'));
  const z=document.elementFromPoint(e.clientX,e.clientY)?.closest('.zone');if(z)drop(d.t.dataset.k,z.dataset.s)}
 else{S.sel=S.sel==d.t.dataset.k?null:d.t.dataset.k;render()}
});
document.addEventListener('click',e=>{
 const g=e.target.closest('[data-go]');
 if(g){if(g.hasAttribute('data-reset')){S=null}init(+g.dataset.go);return}
 if(e.target.closest('[data-next]')){if(S.i+1<Q.length)init(S.i+1);else{S.end=true;render()}return}
 const z=e.target.closest('.zone');if(z&&S.sel)drop(S.sel,z.dataset.s);
});
document.addEventListener('keydown',e=>{if((e.key=='Enter'||e.key==' ')&&e.target.matches('.drag')){e.preventDefault();S.sel=S.sel==e.target.dataset.k?null:e.target.dataset.k;render()}});
S=null;init(0);
</script>
</body>
</html>
